# yaml-language-server: $schema=../generated/schemas/categories.json
categories:
  - id: surveying
    slug: surveying
    name: Surveying
    icon: ruler
    order: 10
    summary: Leveling, traverse and coordinate calculations with every check shown.
    seo:
      title: Surveying Calculators – Leveling & Traverse Tools
      description: Free surveying calculators for leveling and traverse adjustment. Every check and step is shown, and everything runs in your browser.
  - id: construction
    slug: construction
    name: Civil & Construction
    icon: hard-hat
    order: 20
    summary: Concrete, excavation, brickwork, plaster, tile and paint quantity calculators for site engineers and estimators.
    seo:
      title: Construction Calculators – Concrete, Brick, Plaster & Paint
      description: Free construction quantity calculators for concrete, excavation, brickwork, plaster, tiles and paint, with every step shown. Runs in your browser.
    about:
      - Six quantity calculators for site engineers, contractors, estimators and homeowners. The Concrete Quantity Calculator works out concrete volume for a slab, beam, column or footing. The Excavation Calculator works out earthwork volume for a pit, trench or footing, with a bulking allowance. The Brickwork Calculator estimates brick count and brickwork volume for a wall. The Plaster Calculator works out plaster area and volume for a wall, ceiling or surface. The Tile / Flooring Calculator estimates tiles and boxes for a rectangular floor or wall, and the Paint Calculator estimates litres of paint from coverage and coats.
      - These are estimation aids, not structural designs or certified bills of quantities. Local codes, site conditions, mix design, wastage and measurement rules vary by project — verify quantities before purchase or construction, and confirm the final figures with a licensed engineer, architect or professional quantity surveyor.
      - The calculators run entirely in your browser and show their working. The dimensions you enter are never sent to a server.
    faq:
      - q: Are these civil and construction calculators free?
        a: Yes. The calculators are free to use, with no sign-up and no ads.
      - q: Which units can I use?
        a: Enter dimensions in millimetres, centimetres, metres, inches or feet. Volumes are shown in cubic metres and cubic feet, and areas in square metres and square feet. The Brickwork, Tile / Flooring and Paint calculators also show brick count, tiles and boxes, and litres of paint.
      - q: Does this replace a quantity surveyor or engineer?
        a: No. These are estimation aids to help you plan and check quantities. They do not calculate reinforcement, structural design, mix design, material cost or labour, and they do not replace a licensed engineer, architect or professional quantity surveyor.
  - id: logistics
    slug: logistics
    name: Logistics
    icon: container
    order: 30
    summary: Carton volume (CBM), volumetric weight, container loading and pallet loading estimates for freight and shipping.
    seo:
      title: Logistics Calculators – CBM, Weight, Container & Pallet
      description: Free logistics calculators for CBM, volumetric weight, container loading and pallet loading estimates, with every step shown. No sign-up, runs in your browser.
    about:
      - Freight forwarders, couriers, shippers and warehouses price and plan cargo by volume, weight, container capacity and pallet capacity. The CBM Calculator works out the volume of one carton and of a whole shipment in cubic metres and cubic feet. The Volumetric Weight Calculator compares actual and volumetric weight to find the chargeable weight. The Container Loading Calculator estimates how many cartons fit in a container by volume and by a simple loading grid. The Pallet Loading Calculator estimates how many cartons fit on a pallet by a simple base-orientation grid fit, and how many pallets a quantity needs.
      - Volumes, weights and loading estimates are calculated with exact decimal arithmetic and rounded only for display, and every result shows its working so you can check it before you share a quote.
      - The calculators run entirely in your browser. The dimensions and weights you enter are never sent to a server.
    faq:
      - q: Are these logistics calculators free?
        a: Yes. The calculators are free to use, with no sign-up and no ads.
      - q: Which units can I use?
        a: Dimensions in centimetres, metres, millimetres or inches throughout. The CBM Calculator shows cubic metres (CBM) and cubic feet; the Volumetric Weight Calculator accepts weights in kilograms, grams or pounds and shows kilograms; the Container and Pallet Loading Calculators show cubic metres, area and carton counts.
      - q: Do these calculators give the freight rate or a guaranteed loading plan?
        a: No. They give volume, chargeable weight and loading estimates, not prices or a certified stowage or load-safety plan. Confirm freight rates with your carrier or forwarder, and verify the final loading plan with a freight forwarder or logistics professional before shipment.
  - id: export-import
    slug: export-import
    name: Export & Import Documents
    icon: file-up
    order: 35
    summary: Prepare export commercial invoices and packing lists for exporters, ecommerce sellers and MSMEs.
    seo:
      title: Export Documents – Invoice & Packing List Tools
      description: Free tools to prepare export commercial invoices and packing lists for exporters, ecommerce sellers and MSMEs. Runs in your browser, no sign-up.
    about:
      - Practical document generators for small exporters, ecommerce sellers and retail businesses. The Export Commercial Invoice Generator prepares an export invoice draft — exporter, buyer/consignee, item, shipping and declaration details — with the item and invoice totals calculated. The Export Packing List Generator prepares a packing-list draft — exporter, buyer/consignee, item, package count, net/gross weight and declaration details — with an optional one-time transfer of selected details from the Commercial Invoice Generator.
      - These tools help you prepare documents and drafts. They do not file anything with Customs, India Post, DGFT, ICEGATE, DNK, ECCS, or any bank or government portal, and they do not give legal, tax, or FEMA/bank compliance advice. Verify final documents with India Post, your courier, customs broker, CA, bank, or the official portal before filing or shipping.
      - The tools run entirely in your browser. The business and shipment details you enter are never sent to a server.
    faq:
      - q: Are these export document tools free?
        a: Yes. Both tools are free to use, with no sign-up and no ads.
      - q: Do these tools file anything with Customs, India Post, DGFT, ICEGATE, DNK, or ECCS?
        a: No. These are document preparation helpers only. They never file, submit, or integrate with any government or courier filing system. Verify final documents with the relevant official channel before filing or shipping.
      - q: Is this legal, tax, or FEMA/bank compliance advice?
        a: No. These tools help you prepare documents and drafts. Confirm compliance requirements with your CA, customs broker, bank, or the official portal.
  - id: privacy-tools
    slug: privacy-tools
