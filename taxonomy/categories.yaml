  - id: business
    slug: business
    name: Business & Finance
    icon: briefcase
    order: 50
    summary: GST, margin, markup and everyday business calculations.
    seo:
      title: Business Calculators – GST, Margin & Markup
      description: Free business calculators for GST, profit margin and markup with every step shown. No sign-up, no ads, runs in your browser.
    about:
      - These calculators handle the numbers behind everyday pricing and invoicing work. Money is calculated with exact decimal arithmetic and rounded to the paisa, so the totals you see reconcile line by line.
      - Every result shows its working. You can check how each figure was produced before you copy it into an invoice, a quotation or a spreadsheet.
      - The tools run entirely in your browser. The amounts you enter are never sent to a server.
    faq:
      - q: Are these business calculators free?
        a: Yes. The calculators are free to use, with no sign-up and no ads.
      - q: How are amounts rounded?
        a: Money is rounded to two decimal places using commercial rounding, where halves round away from zero. Each tool explains its exact rounding rule on its page.
      - q: Is this tax or accounting advice?
        a: No. The tools help you calculate and check figures. Confirm tax treatment with the official rules or your accountant.
  - id: developer
    slug: developer
    name: Developer & Data
    icon: braces
    order: 60
    summary: Format JSON, convert CSV and JSON, encode Base64 and URLs, and convert timestamps, in your browser.
    seo:
      title: Developer Tools – JSON, CSV, Base64, URL & Timestamps
      description: Free developer tools to format JSON, convert CSV to JSON and back, encode Base64 and URLs, and convert Unix timestamps. Everything runs in your browser.
    about:
      - Six tools for everyday data work. The JSON Formatter formats, minifies and validates JSON. CSV to JSON and JSON to CSV convert between a CSV table and a JSON array of objects. Base64 Encode & Decode and URL Encode & Decode encode and decode text with correct UTF-8. The Timestamp Converter converts a Unix timestamp to a date and back, in seconds or milliseconds, UTC and local time.
      - The tools follow the relevant standards, so the output is predictable in every browser. The JSON Formatter never rounds numbers or rewrites escapes, which matters for large IDs and financial values, and the CSV converters keep values as text rather than guessing types.
      - Everything runs on your device. API keys, tokens and payloads you paste are never uploaded.
    faq:
      - q: Is it safe to paste API responses or tokens here?
        a: The tools run entirely in your browser and make no network requests with your data. As with any tool, avoid pasting secrets on a shared or untrusted computer.
      - q: Which standards do these tools follow?
        a: JSON follows RFC 8259, CSV follows RFC 4180, Base64 follows RFC 4648, URL encoding follows RFC 3986 and the WHATWG form-encoding rules, and Unix time follows the POSIX definition.
      - q: Do the tools work with large inputs?
        a: Yes. Text inputs of up to 50 MB are processed in a background worker so the page stays responsive.
  - id: pdf
    slug: pdf
    name: PDF & Documents
    icon: file-text
    order: 70
    summary: Merge PDF files, split a PDF by page range, and convert JPG images to PDF, entirely in your browser.
    seo:
      title: PDF Tools – Merge, Split & Convert JPG to PDF Online
      description: Free PDF tools to merge, split by page range, and convert JPG images to PDF. Runs entirely in your browser — no upload, no sign-up, no ads.
    about:
      - PDF Merge combines multiple PDF files into a single PDF, in the order you choose, entirely in your browser. PDF Split extracts a page range from a PDF into a new PDF. JPG to PDF converts one or more JPG or JPEG images into a single PDF, one image per page. Nothing is uploaded to a server for any of these tools.
      - These are simple, browser-first tools. Bookmarks, forms, annotations and other advanced PDF features from the original files may not be preserved by PDF Merge or PDF Split, image orientation from camera metadata may not be preserved by JPG to PDF, and very large, encrypted, password-protected or corrupted files may fail to process.
    faq:
      - q: Are these PDF tools free?
        a: Yes. PDF Merge, PDF Split and JPG to PDF are free to use, with no sign-up and no ads.
      - q: Are my files uploaded anywhere?
        a: No. Every tool processes your files in this browser. Nothing is uploaded to a server.
  - id: media
    slug: media
    name: Image & Media
    icon: image
    order: 80
    summary: Resize, compress, convert, crop, watermark and clean JPG, PNG and WebP images, and make favicons, in your browser.
    seo:
      title: Image Tools – Resize, Compress, Convert & Crop Images
      description: "Free image tools for JPG, PNG and WebP: resize, compress, convert, crop, watermark, remove metadata and make favicons. Nothing is uploaded."
    about:
      - Image & Media tools work on a single JPG, PNG or WebP image at a time, entirely in your browser. Image Resize changes the width and height, Image Compress reduces file size where possible, Image Format Converter changes the file format between JPG, PNG and WebP, Image Metadata Remover creates a copy with common metadata removed, Image Watermark adds your own text watermark, Image Crop cuts out an exact pixel rectangle, and Favicon Generator creates a square PNG website icon — all with no sign-up and no watermark added to the result.
      - These are simple, browser-first tools for everyday images, such as preparing a photo for a website, an online store, a social post, a document, or an AI-generated image that arrived in the wrong format. Very large images may fail because of browser memory limits, output can differ slightly between browsers because image encoders vary, and transparent areas are flattened onto a white background when exporting to JPG. Nothing is uploaded to a server.
    faq:
      - q: Are these image tools free?
        a: Yes. The tools are free to use, with no sign-up and no ads.
      - q: Are my images uploaded anywhere?
        a: No. The image you select is read and processed in this browser. No file upload is required for these tools.
