    seo:
      title: Construction Calculators – Quantities & Materials
      description: Free construction calculators for quantities and materials, built for site engineers and estimators. Runs in your browser.
  - id: logistics
    slug: logistics
    name: Logistics
    icon: container
    order: 30
    summary: Carton volume (CBM), volumetric weight, container loading and pallet loading estimates for freight and shipping.
    seo:
      title: Logistics Calculators – CBM, Weight, Container & Pallet
      description: Free logistics calculators for CBM, volumetric weight, container loading and pallet loading estimates, with every step shown. No sign-up, runs in your browser.
    about:
      - Freight forwarders, couriers, shippers and warehouses price and plan cargo by volume, weight, container capacity and pallet capacity. The CBM Calculator works out the volume of one carton and of a whole shipment in cubic metres and cubic feet. The Volumetric Weight Calculator compares actual and volumetric weight to find the chargeable weight. The Container Loading Calculator estimates how many cartons fit in a container by volume and by a simple loading grid. The Pallet Loading Calculator estimates how many cartons fit on a pallet by a simple base-orientation grid fit, and how many pallets a quantity needs.
      - Volumes, weights and loading estimates are calculated with exact decimal arithmetic and rounded only for display, and every result shows its working so you can check it before you share a quote.
      - The calculators run entirely in your browser. The dimensions and weights you enter are never sent to a server.
    faq:
      - q: Are these logistics calculators free?
        a: Yes. Every calculation is free and unlimited, with no sign-up and no ads.
      - q: Which units can I use?
        a: Dimensions in centimetres, metres, millimetres or inches throughout. The CBM Calculator shows cubic metres (CBM) and cubic feet; the Volumetric Weight Calculator accepts weights in kilograms, grams or pounds and shows kilograms; the Container and Pallet Loading Calculators show cubic metres, area and carton counts.
      - q: Do these calculators give the freight rate or a guaranteed loading plan?
        a: No. They give volume, chargeable weight and loading estimates, not prices or a certified stowage or load-safety plan. Confirm freight rates with your carrier or forwarder, and verify the final loading plan with a freight forwarder or logistics professional before shipment.
  - id: privacy-tools
    slug: privacy-tools
    name: Privacy & Compliance
    icon: shield-check
    order: 40
    summary: Remove personal data and hidden metadata before you share files.
    seo:
      title: Privacy Tools – Redact Data & Remove Metadata
      description: Free privacy tools to redact personal data and remove hidden metadata from files. Nothing is uploaded — everything runs on your device.
  - id: business
    slug: business
    name: Business & Finance
    icon: briefcase
    order: 50
    summary: GST, margin, markup and everyday business calculations.
    seo:
      title: Business Calculators – GST, Margin & Markup
      description: Free business calculators for GST, profit margin and markup with every step shown. No sign-up, no ads, runs in your browser.
    about:
      - These calculators handle the numbers behind everyday pricing and invoicing work. Money is calculated with exact decimal arithmetic and rounded to the paisa, so the totals you see reconcile line by line.
      - Every result shows its working. You can check how each figure was produced before you copy it into an invoice, a quotation or a spreadsheet.
      - The tools run entirely in your browser. The amounts you enter are never sent to a server.
    faq:
      - q: Are these business calculators free?
        a: Yes. Every calculation is free and unlimited, with no sign-up and no ads.
      - q: How are amounts rounded?
        a: Money is rounded to two decimal places using commercial rounding, where halves round away from zero. Each tool explains its exact rounding rule on its page.
      - q: Is this tax or accounting advice?
        a: No. The tools help you calculate and check figures. Confirm tax treatment with the official rules or your accountant.
  - id: developer
    slug: developer
    name: Developer & Data
    icon: braces
    order: 60
    summary: Format, encode, convert and generate data — instantly, in your browser.
    seo:
      title: Developer Tools – JSON, Base64, URL Encoding
      description: Free developer tools to format JSON, encode Base64 and URLs, and convert data. Everything runs locally, in your browser.
    about:
      - These tools format, validate and encode data exactly as the relevant standards describe, so the output is predictable in every browser.
      - The JSON formatter never rounds numbers or rewrites escapes, which matters for large IDs and financial values. The encoders follow RFC 4648 and RFC 3986 precisely.
      - Everything runs on your device. API keys, tokens and payloads you paste are never uploaded.
    faq:
      - q: Is it safe to paste API responses or tokens here?
        a: The tools run entirely in your browser and make no network requests with your data. As with any tool, avoid pasting secrets on a shared or untrusted computer.
      - q: Which standards do these tools follow?
        a: JSON follows RFC 8259, Base64 follows RFC 4648, and URL encoding follows RFC 3986 and the WHATWG form-encoding rules.
      - q: Do the tools work with large inputs?
        a: Yes. Text inputs of up to 50 MB are processed in a background worker so the page stays responsive.
  - id: pdf
    slug: pdf
    name: PDF & Documents
    icon: file-text
    order: 70
    summary: Merge multiple PDF files into one, entirely in your browser.
    seo:
      title: PDF Merge – Combine PDF Files Online
      description: Free PDF Merge tool to combine multiple PDF files into one, in the order you choose. Runs entirely in your browser — no upload, no sign-up, no ads.
    about:
      - PDF Merge combines multiple PDF files into a single PDF, in the order you choose, entirely in your browser. Nothing is uploaded to a server.
      - This is a simple, browser-first tool. Bookmarks, forms, annotations and other advanced PDF features from the original files may not be preserved, and very large, encrypted, password-protected or corrupted files may fail to process.
    faq:
      - q: Is PDF Merge free?
        a: Yes. PDF Merge is free and unlimited, with no sign-up and no ads.
      - q: Are my files uploaded anywhere?
        a: No. PDF Merge processes your files in this browser. Nothing is uploaded to a server.
      - q: Will more PDF tools be added?
        a: This category currently has one tool, PDF Merge. Further PDF tools may be added later.
