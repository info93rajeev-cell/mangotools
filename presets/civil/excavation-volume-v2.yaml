      - { value: ft, labelKey: excavation.unit.ft }
  length: { labelKey: excavation.field.length, kind: number, required: true, order: 30, width: half, helpKey: excavation.help.dimension, helpMode: disclosure, convert: { unitField: unit, family: length }, visibleWhen: { excavationType: [general, trench, footing] } }
