    work.paint2.grossArea.roof: "Roof surface area = length × width ÷ cos(pitch) × {quantity} = {result:d4} m²"
    work.paint2.netArea: "Net paintable area = {gross:d2} m² − {openings:d2} m² = {result:d2} m²"
    work.paint2.paintLitres: "Paint = {net:d2} m² × {coats} coat(s) ÷ {coverage:d2} m²/L = {result:d2} L"
    work.paint2.orderLitres: "Paint to buy = {litres:d2} L × (1 + {wastagePercent}%) = {result:d2} L"
    work.paint2.containers: "Containers = paint to buy ÷ container size, rounded up = {result}"
