    paint.help.room: Inside measurement of the room, in the unit chosen above. Changing the unit converts the value.
    paint.help.roomHeight: Floor to ceiling. Wall area = 2 × (length + width) × height.
    paint.help.surface: One wall, ceiling or other flat surface, in the unit chosen above.
    paint.help.roof: Rectangular horizontal roof-plan dimensions. Changing the unit converts both values.
    paint.help.pitchAngle: Uniform roof pitch from 0° (flat) to 89°. The angle is not changed when length units change.
    paint.help.quantity: A whole number from 1 to 1,000,000. Openings below are deducted from each one.
    paint.help.openings: Add each door, window or other unpainted area once, with how many there are.
    paint.help.coats: A whole number from 1 to 20. Two coats is a common default — check your paint system.
    paint.help.coverage: Area one litre (or gallon) covers in one coat. 10 m²/L is only an editable starting estimate — use the figure on your paint's label; rough or porous surfaces need more paint.
    paint.help.wastage: An editable allowance for spillage, rollers and touch-ups (0–50%). Defaults to 10%.
    paint.help.containerSize: The tin or bucket size you will buy. Leave blank to skip; containers are rounded up to whole ones.
    paint.out.orderLitres: Paint to buy incl. wastage (L)
    paint.out.orderGallons: Paint to buy incl. wastage (US gal)
    paint.out.containers: Containers to buy (rounded up)
    paint.out.paintLitres: Calculated paint before wastage (L)
    paint.out.paintGallons: Calculated paint before wastage (US gal)
    paint.out.wastagePercent: Wastage allowance
    paint.out.coats: Coats
    paint.out.netAreaM2: Net paintable area (m²)
    paint.out.netAreaFt2: Net paintable area (ft²)
    paint.out.grossAreaM2: Gross / roof surface area (m²)
    paint.out.grossAreaFt2: Gross / roof surface area (ft²)
    paint.out.openingAreaM2: Openings deducted (m²)
    paint.out.openingAreaFt2: Openings deducted (ft²)
