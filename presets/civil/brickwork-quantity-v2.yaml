    brickwork.help.wallDimension: One wall's outer size, in the wall unit. Changing the unit converts the value.
    brickwork.help.quantity: A whole number from 1 to 1,000,000. Openings below are deducted from each wall.
    brickwork.help.wythes: Bricks are counted on the wall face and multiplied by the number of skins. Bond pattern and collar joints are not modelled.
    brickwork.help.openings: Add each door, window or other opening once with its width, height and how many there are. Leave empty for a solid wall.
    brickwork.help.brickPreset: Regional examples to start from, not universal standards. Every value stays editable below.
    brickwork.help.brickDimension: Size of the brick face you see in the wall (length × height), in the brick unit.
    brickwork.help.mortarJoint: Added to the brick length and height. 10 mm (about ⅜ in) is a common starting value, not a universal size.
    brickwork.help.wastage: An editable estimating allowance for cutting and breakage (0–50%) — not an engineering standard. Defaults to 0%.
