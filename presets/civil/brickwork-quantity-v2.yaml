    brickwork.out.baseBricks: Calculated bricks before wastage
    brickwork.out.wastagePercent: Wastage allowance
    brickwork.out.wastageBricks: Wastage allowance (bricks)
    brickwork.out.netWallAreaM2: Net wall area (m²)
    brickwork.out.netWallAreaFt2: Net wall area (ft²)
    brickwork.out.grossWallAreaM2: Gross wall area (m²)
    brickwork.out.grossWallAreaFt2: Gross wall area (ft²)
    brickwork.out.openingAreaM2: Openings deducted (m²)
    brickwork.out.openingAreaFt2: Openings deducted (ft²)
