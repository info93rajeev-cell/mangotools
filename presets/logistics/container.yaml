  containerType:
    labelKey: cf.field.containerType
    kind: enum
    control: select
    default: 20gp
    order: 60
    width: half
    helpKey: cf.help.containerType
    helpMode: disclosure
    options:
      - { value: 20gp, labelKey: cf.containerType.20gp }
      - { value: 40gp, labelKey: cf.containerType.40gp }
      - { value: 40hc, labelKey: cf.containerType.40hc }
