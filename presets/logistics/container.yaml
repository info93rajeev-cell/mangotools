    kind: enum
    control: segmented
    default: cm
    order: 110
    width: half
    visibleWhen: { containerType: [custom] }
    helpKey: cf.help.containerUnit
    helpMode: disclosure
    options:
      - { value: cm, labelKey: cf.unit.cm }
      - { value: m, labelKey: cf.unit.m }
      - { value: mm, labelKey: cf.unit.mm }
      - { value: in, labelKey: cf.unit.in }
