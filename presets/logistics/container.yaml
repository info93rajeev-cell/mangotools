  usablePercent: { labelKey: cf.field.usablePercent, kind: percent, unit: "%", required: true, default: 90, order: 70, width: half, helpKey: cf.help.usablePercent, helpMode: disclosure }
  containerLength: { labelKey: cf.field.containerLength, kind: number, required: true, order: 80, width: half, visibleWhen: { containerType: [custom] }, helpKey: cf.help.containerDimension, helpMode: disclosure, convert: { unitField: containerUnit, family: length } }
