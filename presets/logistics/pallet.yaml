# yaml-language-server: $schema=../../generated/schemas/preset.json
presetVersion: 1
id: logistics/pallet
version: 0.1.1
operation: logistics.pallet.fit@1
params: { decimals: 3, rounding: half-up, stackable: true, allowBaseRotation: true, keepUpright: true }
userOptions:
  stackable:
    control: switch
    labelKey: pf.option.stackable
    order: 10
  allowBaseRotation:
    control: switch
    labelKey: pf.option.allowBaseRotation
    order: 20
  keepUpright:
    control: switch
    labelKey: pf.option.keepUpright
    order: 30
fields:
  unit:
    labelKey: pf.field.unit
    kind: enum
    control: segmented
    default: cm
    order: 10
    options:
      - { value: cm, labelKey: pf.unit.cm }
      - { value: m, labelKey: pf.unit.m }
      - { value: mm, labelKey: pf.unit.mm }
      - { value: in, labelKey: pf.unit.in }
  length: { labelKey: pf.field.length, kind: number, required: true, order: 20, width: half, helpKey: pf.help.dimension, helpMode: disclosure, convert: { unitField: unit, family: length } }
  width: { labelKey: pf.field.width, kind: number, required: true, order: 30, width: half, helpKey: pf.help.dimension, helpMode: disclosure, convert: { unitField: unit, family: length } }
  height: { labelKey: pf.field.height, kind: number, required: true, order: 40, width: half, helpKey: pf.help.dimension, helpMode: disclosure, convert: { unitField: unit, family: length } }
  quantity: { labelKey: pf.field.quantity, kind: number, required: true, default: 1, order: 50, width: half, helpKey: pf.help.quantity, helpMode: disclosure }
  palletType:
    labelKey: pf.field.palletType
    kind: enum
    control: select
    default: euro
    order: 60
    width: half
    helpKey: pf.help.palletType
    helpMode: disclosure
    options:
      - { value: euro, labelKey: pf.palletType.euro }
      - { value: us, labelKey: pf.palletType.us }
      - { value: custom, labelKey: pf.palletType.custom }
  palletUnit:
    labelKey: pf.field.palletUnit
    kind: enum
    control: segmented
    default: cm
    order: 70
    width: half
    helpKey: pf.help.palletUnit
    helpMode: disclosure
    options:
      - { value: cm, labelKey: pf.unit.cm }
      - { value: m, labelKey: pf.unit.m }
      - { value: mm, labelKey: pf.unit.mm }
      - { value: in, labelKey: pf.unit.in }
  palletLength: { labelKey: pf.field.palletLength, kind: number, required: true, order: 80, width: half, visibleWhen: { palletType: [custom] }, helpKey: pf.help.palletDimension, helpMode: disclosure, convert: { unitField: palletUnit, family: length } }
  palletWidth: { labelKey: pf.field.palletWidth, kind: number, required: true, order: 90, width: half, visibleWhen: { palletType: [custom] }, helpKey: pf.help.palletDimension, helpMode: disclosure, convert: { unitField: palletUnit, family: length } }
  maxStackHeight: { labelKey: pf.field.maxStackHeight, kind: number, required: true, default: 150, order: 100, width: half, helpKey: pf.help.maxStackHeight, helpMode: disclosure, convert: { unitField: palletUnit, family: length } }
  decimalPlaces:
    labelKey: pf.field.decimalPlaces
    kind: enum
    control: segmented
    default: 3
    order: 110
    width: half
    options:
      - { value: 2, labelKey: pf.decimalPlaces.2 }
      - { value: 3, labelKey: pf.decimalPlaces.3 }
      - { value: 4, labelKey: pf.decimalPlaces.4 }
outputs:
  cartonsPerPallet: { labelKey: pf.out.cartonsPerPallet, format: number, order: 10, primary: true }
  palletsRequired: { labelKey: pf.out.palletsRequired, format: number, order: 20 }
  cartonsPerLayer: { labelKey: pf.out.cartonsPerLayer, format: number, order: 30 }
  layers: { labelKey: pf.out.layers, format: number, order: 40 }
  cartonsOnLastPallet: { labelKey: pf.out.cartonsOnLastPallet, format: number, order: 50, visible: false }
  cartonsAlongPalletLength: { labelKey: pf.out.cartonsAlongPalletLength, format: number, order: 60, visible: false }
  cartonsAlongPalletWidth: { labelKey: pf.out.cartonsAlongPalletWidth, format: number, order: 70, visible: false }
  usedAreaPercent: { labelKey: pf.out.usedAreaPercent, format: percent, decimalPlacesField: decimalPlaces, order: 80, visible: false }
  unusedAreaPercent: { labelKey: pf.out.unusedAreaPercent, format: percent, decimalPlacesField: decimalPlaces, order: 90, visible: false }
  estimatedStackHeight: { labelKey: pf.out.estimatedStackHeight, format: number, decimalPlacesField: decimalPlaces, order: 100 }
  leftoverPalletLength: { labelKey: pf.out.leftoverPalletLength, format: number, decimalPlacesField: decimalPlaces, order: 110, visible: false }
  leftoverPalletWidth: { labelKey: pf.out.leftoverPalletWidth, format: number, decimalPlacesField: decimalPlaces, order: 120, visible: false }
samples:
  carton-40-30-20-euro-x100:
    titleKey: pf.sample.carton
    input: { unit: cm, length: "40", width: "30", height: "20", quantity: "100", palletType: euro, palletUnit: cm, maxStackHeight: "150", decimalPlaces: "3" }
ui: { archetypes: [B], density: compact, compute: live, collapseNotices: true }
strings:
  en:
    pf.option.stackable: Stackable
    pf.option.allowBaseRotation: Allow base rotation
    pf.option.keepUpright: Keep carton upright
    pf.field.unit: Carton unit
    pf.unit.cm: cm
    pf.unit.m: m
    pf.unit.mm: mm
    pf.unit.in: in
    pf.field.length: Carton length
    pf.field.width: Carton width
    pf.field.height: Carton height
    pf.field.quantity: Cartons
    pf.field.palletType: Pallet type
    pf.palletType.euro: Euro pallet
    pf.palletType.us: US pallet
    pf.palletType.custom: Custom
    pf.field.palletUnit: Pallet/stack unit
    pf.field.palletLength: Custom pallet length
    pf.field.palletWidth: Custom pallet width
    pf.field.maxStackHeight: Max stack height
    pf.field.decimalPlaces: Decimal places
    pf.decimalPlaces.2: "2"
    pf.decimalPlaces.3: "3"
    pf.decimalPlaces.4: "4"
    pf.help.dimension: Outer size of one carton in the selected unit. Changing the unit converts this value.
    pf.help.quantity: Cartons of this size, a whole number from 1 to 1,000,000.
    pf.help.palletType: Pick a standard pallet, or Custom to enter your own base dimensions.
    pf.help.palletUnit: Used for a custom pallet's length and width, and for maximum stack height. Changing it converts entered values.
    pf.help.palletDimension: Base size of the custom pallet in the selected pallet unit.
    pf.help.maxStackHeight: The load height above the pallet deck that you allow, not including the pallet itself. Varies by warehouse, trailer or carrier — check yours.
    pf.out.cartonsPerPallet: Cartons per pallet
    pf.out.palletsRequired: Pallets required
    pf.out.cartonsPerLayer: Cartons per layer
    pf.out.layers: Layers
    pf.out.cartonsOnLastPallet: Cartons on last pallet
    pf.out.cartonsAlongPalletLength: Cartons along pallet length
    pf.out.cartonsAlongPalletWidth: Cartons along pallet width
    pf.out.usedAreaPercent: Used pallet area (%)
    pf.out.unusedAreaPercent: Unused pallet area (%)
    pf.out.estimatedStackHeight: Estimated stack height (cm)
    pf.out.leftoverPalletLength: Leftover length (cm)
    pf.out.leftoverPalletWidth: Leftover width (cm)
    pf.sample.carton: 40 × 30 × 20 cm, 100 cartons, Euro pallet
    work.pf.orientation.lwh: "Simple grid fit: carton length along the pallet's length, width along its width → {alongLength:number} × {alongWidth:number} = {result} cartons per layer, with {leftoverLength} cm and {leftoverWidth} cm left over on the base. This is a simple grid estimate, not advanced pallet optimisation."
    work.pf.orientation.lhw: "Simple grid fit: carton length along the pallet's length, height along its width → {alongLength:number} × {alongWidth:number} = {result} cartons per layer, with {leftoverLength} cm and {leftoverWidth} cm left over on the base. This is a simple grid estimate, not advanced pallet optimisation."
    work.pf.orientation.wlh: "Simple grid fit: carton width along the pallet's length, length along its width → {alongLength:number} × {alongWidth:number} = {result} cartons per layer, with {leftoverLength} cm and {leftoverWidth} cm left over on the base. This is a simple grid estimate, not advanced pallet optimisation."
    work.pf.orientation.whl: "Simple grid fit: carton width along the pallet's length, height along its width → {alongLength:number} × {alongWidth:number} = {result} cartons per layer, with {leftoverLength} cm and {leftoverWidth} cm left over on the base. This is a simple grid estimate, not advanced pallet optimisation."
    work.pf.orientation.hlw: "Simple grid fit: carton height along the pallet's length, length along its width → {alongLength:number} × {alongWidth:number} = {result} cartons per layer, with {leftoverLength} cm and {leftoverWidth} cm left over on the base. This is a simple grid estimate, not advanced pallet optimisation."
    work.pf.orientation.hwl: "Simple grid fit: carton height along the pallet's length, width along its width → {alongLength:number} × {alongWidth:number} = {result} cartons per layer, with {leftoverLength} cm and {leftoverWidth} cm left over on the base. This is a simple grid estimate, not advanced pallet optimisation."
    work.pf.layers: "Layers = floor({maxStackHeight} cm ÷ {cartonHeightOnAxis} cm on the vertical axis) = {result} layers"
    work.pf.cartonsPerPallet: "Total cartons per pallet = {cartonsPerLayer} cartons per layer × {layers} layers = {result} cartons"
    work.pf.palletsRequired: "Pallets required = ceil({quantity:number} cartons ÷ {cartonsPerPallet} cartons per pallet) = {result} pallets"
    work.pf.cartonsOnLastPallet: "Cartons on the last pallet = {quantity:number} cartons ÷ {cartonsPerPallet} cartons per pallet, remainder = {result} cartons"
    work.pf.usedArea: "Used pallet area = ({cartonsPerLayer} cartons per layer's footprint) ÷ ({palletLength} cm × {palletWidth} cm) = {result}% of the pallet base"
    work.pf.estimatedStackHeight: "Estimated stack height = {result} cm, of the {maxStackHeight} cm allowed"
