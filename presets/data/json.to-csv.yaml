  keys:
    control: select
    labelKey: jsonToCsv.option.keys
    order: 30
    values: { union: { labelKey: jsonToCsv.keys.union }, first: { labelKey: jsonToCsv.keys.first } }
  nested:
    control: select
    labelKey: jsonToCsv.option.nested
    order: 40
    values: { flatten: { labelKey: jsonToCsv.nested.flatten }, json: { labelKey: jsonToCsv.nested.json }, reject: { labelKey: jsonToCsv.nested.reject } }
  formulaGuard: { control: switch, labelKey: jsonToCsv.option.formulaGuard, order: 50 }
  recordPath: { control: select, labelKey: jsonToCsv.option.recordPath, order: 60, visible: false }
