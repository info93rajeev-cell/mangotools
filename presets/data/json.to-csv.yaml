  headers: { labelKey: jsonToCsv.out.headers, format: text, order: 40 }
samples:
  name-age:
    titleKey: jsonToCsv.sample.nameAge
    input:
      text: |-
        [
          { "name": "Raj", "age": "50" },
          { "name": "Aiva", "age": "19" }
        ]
  team-records:
    titleKey: jsonToCsv.sample.teamRecords
    input:
      text: |-
        [
          {
            "name": "Asha Rao",
            "city": "Delhi",
            "sku": "00124",
            "active": "true"
          },
          {
            "name": "Ben Li",
            "city": "Singapore",
            "sku": "00085",
            "active": "false"
          },
          {
            "name": "Mira Shah",
            "city": "Mumbai",
            "sku": "00941",
            "active": "true"
          },
          {
            "name": "Evan Cole",
            "city": "London",
            "sku": "04102",
            "active": "true"
          }
        ]
  nested-orders:
    titleKey: jsonToCsv.sample.nestedOrders
    input:
      text: |-
        {
          "store": "Pune",
          "orders": [
            { "id": "A-101", "customer": { "name": "Ravi", "city": "Pune" }, "items": ["pen", "ink"] },
            { "id": "A-102", "customer": { "name": "Lena", "city": "Goa" }, "items": ["pad"] }
          ]
        }
    params: { recordPath: orders }
ui: { archetypes: [A], density: comfortable, compute: live, outputFileName: data.csv, outputMime: text/csv }
