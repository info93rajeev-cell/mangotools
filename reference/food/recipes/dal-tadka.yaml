  notes: >-
    Three sources use 1 cup toor dal for about 4 servings; one states 1 cup = 200 g. Tempering
    amounts (ghee, cumin, chillies, hing) match the sources. Garlic varies between sources (4 to 8
    cloves); 4 is used. Not kitchen-tested. Compounded hing usually contains wheat flour, so the
    recipe carries the gluten allergen through that ingredient.
