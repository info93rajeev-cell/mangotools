# Original BeyondTheAI recipe text. Quantities cross-checked against the sources below.
id: dal-tadka
version: 0.1.0
name: Dal Tadka
localName: दाल तड़का
course: dal
cuisine: North Indian
diet: vegetarian
servings: 4
prepMinutes: 15
cookMinutes: 30
ingredients:
  - { ingredient: toor-dal, quantity: "200", unit: g }
  - { ingredient: turmeric-powder, quantity: "0.5", unit: tsp }
  - { ingredient: salt, quantity: "1", unit: tsp, note: adjust to taste }
  - { ingredient: tomato, quantity: "2", unit: piece, note: chopped }
  - { ingredient: onion, quantity: "1", unit: piece, note: finely chopped }
  - { ingredient: ghee, quantity: "2", unit: tbsp }
  - { ingredient: cumin-seeds, quantity: "1", unit: tsp }
  - { ingredient: garlic, quantity: "4", unit: piece, note: sliced }
  - { ingredient: dried-red-chilli, quantity: "2", unit: piece }
  - { ingredient: asafoetida, quantity: "0.25", unit: tsp }
  - { ingredient: coriander-leaves, quantity: "2", unit: tbsp }
steps:
  - Wash the dal until the water is clear. Pressure cook it with 750 ml water, the turmeric and the salt for 4 to 5 whistles, or simmer it covered for about 40 minutes, until it is completely soft.
  - Whisk the cooked dal lightly and add hot water a little at a time until it pours like thick soup.
  - In a separate pan heat the ghee. Add the cumin seeds and, once they crackle, the dried chillies, garlic and asafoetida. Fry until the garlic just turns golden.
  - Add the onion and cook until soft, then add the tomatoes and cook until they break down.
  - Pour this tempering into the dal, simmer together for 3 to 4 minutes and check the salt.
  - Scatter the coriander leaves on top just before serving.
