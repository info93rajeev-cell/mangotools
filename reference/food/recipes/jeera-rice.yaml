id: jeera-rice
version: 0.1.0
name: Jeera Rice
localName: जीरा राइस
course: rice
cuisine: North Indian
diet: vegetarian
servings: 4
prepMinutes: 25
cookMinutes: 20
ingredients:
  - { ingredient: basmati-rice, quantity: "200", unit: g }
  - { ingredient: ghee, quantity: "1", unit: tbsp }
  - { ingredient: cumin-seeds, quantity: "2", unit: tsp }
  - { ingredient: bay-leaf, quantity: "1", unit: piece }
  - { ingredient: salt, quantity: "1", unit: tsp, note: adjust to taste }
steps:
  - Rinse the rice in three changes of water until the water runs almost clear, then soak it for 20 minutes and drain well.
  - Warm the ghee in a heavy pan on medium heat. Add the cumin seeds and the bay leaf and let the seeds crackle for about 30 seconds without browning too far.
  - Tip in the drained rice and stir gently for a minute so every grain is coated with ghee.
  - Pour in 500 ml of water, add the salt and bring to a boil.
  - Lower the heat, cover tightly and cook for 12 to 15 minutes until the water is absorbed and the grains are tender.
  - Turn off the heat and leave the pan covered for 5 minutes, then loosen the rice with a fork and remove the bay leaf before serving.
