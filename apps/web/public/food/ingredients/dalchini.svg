<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <title>Cinnamon Sticks (Dalchini)</title>
  <rect width="80" height="80" rx="14" fill="#fdf8f6"/>
  <!-- Rolled bark quill 1 -->
  <g transform="translate(34, 40) rotate(-30)">
    <rect x="-5" y="-22" width="10" height="44" rx="2" fill="#9a3412" stroke="#7c2d12" stroke-width="1"/>
    <!-- Roll swirl on top -->
    <ellipse cx="0" cy="-22" rx="5" ry="2.5" fill="#c2410c"/>
    <ellipse cx="0" cy="-22" rx="2.5" ry="1.2" fill="#7c2d12"/>
    <line x1="-3" y1="-15" x2="-3" y2="15" stroke="#7c2d12" stroke-width="0.8"/>
  </g>
  <!-- Rolled bark quill 2 -->
  <g transform="translate(46, 38) rotate(20)">
    <rect x="-5" y="-20" width="10" height="40" rx="2" fill="#b45309" stroke="#78350f" stroke-width="1"/>
    <ellipse cx="0" cy="-20" rx="5" ry="2.5" fill="#d97706"/>
    <ellipse cx="0" cy="-20" rx="2.5" ry="1.2" fill="#78350f"/>
    <line x1="2" y1="-12" x2="2" y2="12" stroke="#78350f" stroke-width="0.8"/>
  </g>
</svg>