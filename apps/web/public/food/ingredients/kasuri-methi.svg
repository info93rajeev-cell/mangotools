<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <title>Kasuri Methi (Dried Fenugreek Leaves)</title>
  <rect width="80" height="80" rx="14" fill="#fefce8"/>
  <!-- Terracotta katori bowl -->
  <ellipse cx="40" cy="52" rx="26" ry="12" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
  <ellipse cx="40" cy="48" rx="24" ry="10" fill="#78350f"/>
  <!-- Heap of crushed dry dark olive green leaves -->
  <ellipse cx="40" cy="46" rx="21" ry="8" fill="#3f6212"/>
  <path d="M 24 45 Q 32 36 40 38 Q 48 35 56 45 Z" fill="#4d7c0f"/>
  <!-- Scattered dried flakes -->
  <polygon points="32,40 35,38 33,43" fill="#65a30d"/>
  <polygon points="42,36 45,34 44,39" fill="#84cc16"/>
  <polygon points="48,41 51,39 50,44" fill="#65a30d"/>
  <polygon points="36,44 38,42 39,46" fill="#84cc16"/>
  <polygon points="28,44 30,42 30,46" fill="#4d7c0f"/>
</svg>