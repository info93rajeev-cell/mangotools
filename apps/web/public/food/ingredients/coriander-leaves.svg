<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <title>Fresh Coriander / Cilantro Leaves</title>
  <rect width="80" height="80" rx="14" fill="#f0fdf4"/>
  <!-- Stems -->
  <path d="M 40 68 Q 38 48 30 32" stroke="#16a34a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 40 68 Q 42 46 52 30" stroke="#16a34a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 40 68 Q 40 44 40 22" stroke="#15803d" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Leaf clusters with scalloped edges -->
  <!-- Center top -->
  <path d="M 40 22 C 32 18 34 10 40 10 C 46 10 48 18 40 22 Z" fill="#22c55e" stroke="#16a34a" stroke-width="1"/>
  <circle cx="35" cy="14" r="3" fill="#22c55e"/>
  <circle cx="45" cy="14" r="3" fill="#22c55e"/>
  <!-- Left branch -->
  <path d="M 30 32 C 22 28 22 20 28 20 C 34 20 36 28 30 32 Z" fill="#16a34a" stroke="#15803d" stroke-width="1"/>
  <circle cx="24" cy="24" r="3.2" fill="#22c55e"/>
  <circle cx="32" cy="22" r="2.8" fill="#16a34a"/>
  <!-- Right branch -->
  <path d="M 52 30 C 60 26 60 18 54 18 C 48 18 46 26 52 30 Z" fill="#22c55e" stroke="#16a34a" stroke-width="1"/>
  <circle cx="58" cy="22" r="3.2" fill="#22c55e"/>
  <circle cx="50" cy="20" r="2.8" fill="#16a34a"/>
</svg>