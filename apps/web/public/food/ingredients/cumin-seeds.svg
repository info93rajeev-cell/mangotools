<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <title>Whole Cumin Seeds (Jeera)</title>
  <rect width="80" height="80" rx="14" fill="#fefce8"/>
  <!-- Scatter of slender ridged jeera seeds -->
  <!-- Seed 1 -->
  <g transform="translate(24, 28) rotate(-35)">
    <path d="M-14 0 C -7 -4 7 -4 14 0 C 7 4 -7 4 -14 0 Z" fill="#854d0e" stroke="#713f12" stroke-width="1"/>
    <path d="M-10 0 L 10 0" stroke="#ca8a04" stroke-width="0.8" stroke-dasharray="1 1"/>
  </g>
  <!-- Seed 2 -->
  <g transform="translate(48, 22) rotate(25)">
    <path d="M-13 0 C -6 -3.5 6 -3.5 13 0 C 6 3.5 -6 3.5 -13 0 Z" fill="#a16207" stroke="#713f12" stroke-width="1"/>
    <path d="M-9 0 L 9 0" stroke="#fde047" stroke-width="0.8" stroke-dasharray="1 1"/>
  </g>
  <!-- Seed 3 -->
  <g transform="translate(38, 44) rotate(-10)">
    <path d="M-15 0 C -7 -4 7 -4 15 0 C 7 4 -7 4 -15 0 Z" fill="#78350f" stroke="#451a03" stroke-width="1"/>
    <path d="M-11 0 L 11 0" stroke="#eab308" stroke-width="0.8" stroke-dasharray="1 1"/>
  </g>
  <!-- Seed 4 -->
  <g transform="translate(56, 52) rotate(45)">
    <path d="M-12 0 C -6 -3 6 -3 12 0 C 6 3 -6 3 -12 0 Z" fill="#854d0e" stroke="#713f12" stroke-width="1"/>
    <path d="M-8 0 L 8 0" stroke="#ca8a04" stroke-width="0.8" stroke-dasharray="1 1"/>
  </g>
  <!-- Seed 5 -->
  <g transform="translate(22, 54) rotate(15)">
    <path d="M-11 0 C -5 -3 5 -3 11 0 C 5 3 -5 3 -11 0 Z" fill="#a16207" stroke="#713f12" stroke-width="1"/>
  </g>
</svg>