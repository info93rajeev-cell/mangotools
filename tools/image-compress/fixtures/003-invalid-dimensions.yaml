id: 003-invalid-dimensions
preset: image/compress
source:
  type: synthetic
  citation: "tiny.jpg (fixtures/files/), copied from engines/image's own fixtures: has a valid JPEG signature; checks that a zero target dimension is rejected before any attempt to decode the file. In the real UI these fields are always prefilled from the decoded image, but the operation itself must still reject an invalid value defensively."
input:
  file: { name: tiny.jpg, bytes: { path: tiny.jpg } }
  targetWidth: 0
  targetHeight: 100
  keepAspectRatio: true
  outputFormat: same
expectedError:
  code: IMAGE_DIMENSIONS_INVALID
