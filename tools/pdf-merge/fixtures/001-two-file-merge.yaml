id: 001-two-file-merge
preset: pdf/merge
source:
  type: synthetic
  citation: "one-page.pdf (1 page, 100x100) and two-page.pdf (2 pages, 150x150), the same tiny generated PDFs used by the engine's own fixtures (TASK-004B PR 1)"
input:
  files:
    - { name: one-page.pdf, bytes: { path: one-page.pdf } }
    - { name: two-page.pdf, bytes: { path: two-page.pdf } }
expected:
  fileName: merged.pdf
  fileCount: 2
  totalPageCount: 3
expectedWarnings: [PDF_MERGE_VERIFY_OUTPUT, PDF_MERGE_FEATURES_MAY_NOT_BE_PRESERVED, PDF_MERGE_LARGE_OR_PROTECTED_MAY_FAIL, PDF_MERGE_AUTHORIZED_USE_ONLY]
