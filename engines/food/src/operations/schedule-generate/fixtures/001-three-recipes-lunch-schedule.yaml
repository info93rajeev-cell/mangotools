  burnersAvailable: 4
  prepStations: 2
  guests: 4
  recipes:
    - id: jeera-rice
      version: 0.1.0
      name: Jeera Rice
      servings: 4
      prepMinutes: 10
      cookMinutes: 20
      steps:
        - Wash basmati rice and soak in water for 20 minutes.
        - Heat ghee and add cumin seeds until aromatic.
        - Add drained rice and water; simmer until cooked.
    - id: dal-tadka
      version: 0.1.0
      name: Dal Tadka
      servings: 4
      prepMinutes: 15
      cookMinutes: 25
      steps:
        - Pressure cook rinsed toor dal with turmeric and salt.
        - Prepare tempering with ghee, cumin, garlic, and dried chillies.
        - Pour tempering over hot cooked dal.
    - id: aloo-gobi
      version: 0.1.0
      name: Aloo Gobi
      servings: 4
      prepMinutes: 15
      cookMinutes: 25
      steps:
        - Cut cauliflower into florets and peel potatoes into cubes.
        - Saute cumin, ginger-garlic, onion, and spices in oil.
        - Add vegetables and cook covered on low flame.
