id: 001-three-recipes-lunch-schedule
operation: food.schedule.generate@1
source:
  type: synthetic
  citation: >-
    Three recipes scheduled backward from 13:00 lunch with 4 burners.
    Rest 10 min. Dishes finish cooking at 12:50.
    Dal Tadka (cook 25, prep 15) starts prep at 12:10.
    Aloo Gobi (cook 25, prep 15) starts prep at 12:10.
    Jeera Rice (cook 20, prep 10) starts prep at 12:20.
input:
