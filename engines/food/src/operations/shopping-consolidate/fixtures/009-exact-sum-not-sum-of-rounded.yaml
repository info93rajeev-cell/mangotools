id: 009-exact-sum-not-sum-of-rounded
operation: food.shopping.consolidate@1
source:
  type: hand-verified
  citation: >-
    Three recipes of 3 servings each use 1 g rice; 1 guest gives each a factor of 1/3, shown as
    0.333 and reported as rounded. The exact sum is 1/3 + 1/3 + 1/3 = 1 g. Adding the rounded
    values would give 0.999 g, so this proves displayed values are never reused in arithmetic.
input:
  ingredients:
    - { id: rice, dimension: mass }
  recipes:
    - { id: rice-a, version: 0.1.0, servings: 3, diet: vegan, ingredients: [{ ingredient: rice, quantity: "1", unit: g }] }
    - { id: rice-b, version: 0.1.0, servings: 3, diet: vegan, ingredients: [{ ingredient: rice, quantity: "1", unit: g }] }
    - { id: rice-c, version: 0.1.0, servings: 3, diet: vegan, ingredients: [{ ingredient: rice, quantity: "1", unit: g }] }
  selection:
    - { recipe: rice-a, recipeVersion: 0.1.0 }
    - { recipe: rice-b, recipeVersion: 0.1.0 }
    - { recipe: rice-c, recipeVersion: 0.1.0 }
  guests: 1
expected:
  scale:
    - { recipe: rice-a, factor: "0.333" }
    - { recipe: rice-b, factor: "0.333" }
    - { recipe: rice-c, factor: "0.333" }
  lines:
    - { ingredient: rice, total: "1", unit: g, buy: "1", usedIn: [rice-a, rice-b, rice-c] }
  rounded: ["scale:rice-a", "scale:rice-b", "scale:rice-c"]
expectedWarnings: [FOOD_VALUES_ROUNDED]
