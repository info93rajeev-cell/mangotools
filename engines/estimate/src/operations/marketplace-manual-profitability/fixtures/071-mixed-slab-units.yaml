    weightSlabs:
    - max: '0.5'
      unit: kg
      amount: '40'
    - min: '500'
      unit: g
      amount: '60'
    gstTreatment: none
expectedError: { code: ESTIMATE_UNIT_MISMATCH, path: feeLines.0.weightSlabs.1.unit }
