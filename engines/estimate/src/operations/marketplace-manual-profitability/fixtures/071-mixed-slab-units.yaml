input:
  sellingPricePerUnit: '1000'
  quantity: '1'
  productCostPerUnit: '500'
  chargeableWeight:
    value: '0.4'
    unit: kg
  feeLines:
  - id: weight-handling
    enabled: true
    mode: weight-slabs
