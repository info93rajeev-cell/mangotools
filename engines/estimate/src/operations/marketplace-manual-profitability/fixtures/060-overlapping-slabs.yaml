id: 060-overlapping-slabs
operation: estimate.marketplace.manual-profitability@1
source: { type: hand-verified, citation: "TASK-008L contract formulas; expected values recomputed independently with Python Decimal" }
input:
  sellingPricePerUnit: '1000'
  quantity: '1'
  productCostPerUnit: '500'
  feeLines:
  - id: closing
    enabled: true
    mode: price-slabs
    slabPriceBase: entered-unit-selling-price
    priceSlabs:
    - max: '600'
      chargeMode: fixed
      value: '10'
    - min: '500'
      chargeMode: fixed
      value: '20'
    gstTreatment: none
    quantityScope: per-order
expectedError: { code: ESTIMATE_OVERLAPPING_SLABS, path: feeLines.0.priceSlabs.1 }
