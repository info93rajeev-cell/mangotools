id: 006-sort-keys
operation: data.json.format@1
source: { type: hand-verified, citation: "Keys sorted by Unicode code point, recursively" }
params: { action: format, indent: "2", sortKeys: true }
input:
  text: '{"b":1,"a":{"d":1,"c":2}}'
expected:
  text: |-
    {
      "a": {
        "c": 2,
        "d": 1
      },
      "b": 1
    }
