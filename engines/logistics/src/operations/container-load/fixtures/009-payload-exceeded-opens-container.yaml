expected: {status: "complete", containersRequired: "2", loadedPieces: "57", loadedWeight: "28500.00", payloadCapacity: "56000.00", packages: [{index: 0, description: "", length: "50", width: "50", height: "50", unit: "cm", requested: "57", loaded: "57", unloaded: "0", unitVolume: "0.125", requestedVolume: "7.125", loadedVolume: "7.125", unitWeight: "500.00", loadedWeight: "28500.00", unloadedReason: null, byContainer: ["56", "1"]}], containers: [{index: 0, pieces: "56", loadedVolume: "7.000", volumeUtilizationPercent: "21.1", loadedWeight: "28000.00", weightUtilizationPercent: "100.0", weightLimitReached: true, spaceLimitReached: false}, {index: 1, pieces: "1", loadedVolume: "0.125", volumeUtilizationPercent: "0.4", loadedWeight: "500.00", weightUtilizationPercent: "1.8", weightLimitReached: false, spaceLimitReached: false}]}
expectedWarnings: [LOGISTICS_LOAD_PLANNING_AID, LOGISTICS_CONTAINER_NOMINAL_REFERENCE, LOGISTICS_CONTAINER_VERIFY_PROFESSIONAL, LOGISTICS_LOAD_MULTIPLE_CONTAINERS, LOGISTICS_LOAD_WEIGHT_LIMIT_REACHED]
