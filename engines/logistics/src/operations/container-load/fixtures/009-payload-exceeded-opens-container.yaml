id: 009-payload-exceeded-opens-container
operation: logistics.container.load@1
source: { type: hand-verified, citation: "57 pieces × 500 kg: only 56 fit under the 28,000 kg payload (56 × 500 = 28,000; 57 × 500 = 28,500), so the 57th — which would fit geometrically — goes into a second container" }
