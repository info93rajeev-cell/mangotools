expected: {status: "none", containersRequired: "0", loadedPieces: "0", packages: [{index: 0, description: "", length: "200", width: "200", height: "200", unit: "cm", requested: "1", loaded: "0", unloaded: "1", unitVolume: "8.000", requestedVolume: "8.000", loadedVolume: "0.000", unitWeight: "30000.00", loadedWeight: "0.00", unloadedReason: "weight-exceeds-payload", byContainer: []}]}
expectedWarnings: [LOGISTICS_LOAD_PLANNING_AID, LOGISTICS_CONTAINER_NOMINAL_REFERENCE, LOGISTICS_CONTAINER_VERIFY_PROFESSIONAL, LOGISTICS_LOAD_PARTIAL]
