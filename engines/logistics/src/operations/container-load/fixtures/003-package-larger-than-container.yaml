id: 003-package-larger-than-container
operation: logistics.container.load@1
source: { type: hand-verified, citation: "A 700 cm piece is longer than the 589.8 cm 20 ft container in every orientation; the 60×40×40 pieces still load (10 pieces, 0.96 m³ ÷ 33.195925728 = 2.9%)" }
