id: 005-rotation-prohibited
operation: logistics.container.load@1
source: { type: hand-verified, citation: "The same 250 cm tall piece with rotation off keeps 250 vertical, above the 239.3 cm container height → no feasible orientation, nothing loads" }
params: { allowRotation: false }
input: { packages: [{ length: "60", width: "40", height: "250", unit: cm, quantity: "2" }], containerType: 20gp }
expected: {status: "none", containersRequired: "0", loadedPieces: "0", unloadedPieces: "2", blocks: [], packages: [{index: 0, description: "", length: "60", width: "40", height: "250", unit: "cm", requested: "2", loaded: "0", unloaded: "2", unitVolume: "0.600", requestedVolume: "1.200", loadedVolume: "0.000", unitWeight: null, loadedWeight: null, unloadedReason: "no-feasible-orientation", byContainer: []}]}
expectedWarnings: [LOGISTICS_LOAD_PLANNING_AID, LOGISTICS_CONTAINER_NOMINAL_REFERENCE, LOGISTICS_CONTAINER_VERIFY_PROFESSIONAL, LOGISTICS_LOAD_PARTIAL]
