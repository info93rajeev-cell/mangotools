id: 008-allow-base-rotation-off
operation: logistics.pallet.fit@1
source: { type: hand-verified, citation: "Same carton and pallet as fixture 001 (40×30×20 cm, Euro pallet, 150 cm stack limit) but allowBaseRotation: false, so only the carton's given length-along-length, width-along-width footprint is tried: floor(120/40)=3, floor(80/30)=2 = 6 cartons/layer, fewer than the 8 the rotated footprint gives in fixture 001. Layers = 7, cartons per pallet = 42, so the 100 requested need 3 pallets, with 16 on the last one" }
