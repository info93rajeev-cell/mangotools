params: { allowBaseRotation: false }
expected: { bestOrientation: lwh, cartonsAlongPalletLength: "3", cartonsAlongPalletWidth: "2", cartonsPerLayer: "6", layers: "7", cartonsPerPallet: "42", palletsRequired: "3", cartonsOnLastPallet: "16", usedAreaPercent: "75.000", unusedAreaPercent: "25.000", estimatedStackHeight: "140.000", leftoverPalletLength: "0.000", leftoverPalletWidth: "20.000", quantity: "100" }
expectedWarnings: [LOGISTICS_PALLET_NOT_LOAD_SAFETY, LOGISTICS_PALLET_VERIFY_BEFORE_SHIPMENT, LOGISTICS_PALLET_DIMENSIONS_VARY, LOGISTICS_PALLET_MULTIPLE_PALLETS_REQUIRED]
